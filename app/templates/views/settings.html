            <!-- ─────────────────────────────── VIEW: SETTINGS ─── -->
            <div id="view-settings" class="hidden space-y-4">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <div class="lg:col-span-2 g1 rounded-2xl p-6 space-y-6 shadow-sm">
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 border-b border-slate-100">Core Configuration</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Starting Capital ($)</label>
                                <input type="number" id="set-starting-cap" value="10000" step="100" class="w-full g1 rounded-xl py-3 px-4 text-xs text-slate-800" />
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Monthly Spending Limit ($)</label>
                                <input type="number" id="set-spending-limit" value="5000" step="100" class="w-full g1 rounded-xl py-3 px-4 text-xs text-slate-800" />
                            </div>
                        </div>
                        <div class="space-y-2.5">
                            <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-widest">AI Provider</label>
                            <div class="grid grid-cols-2 gap-2.5">
                                <button id="provider-gemini-btn" onclick="selectProvider('gemini', this)" class="rounded-xl p-3 text-xs font-bold text-emerald-700 transition-all flex items-center justify-center gap-1.5" style="background:rgba(5,150,105,0.08);border:1px solid rgba(5,150,105,0.2)">
                                    <span class="material-symbols-outlined text-sm">auto_awesome</span> Gemini
                                </button>
                                <button id="provider-claude-btn" onclick="selectProvider('claude', this)" class="g1 rounded-xl p-3 text-xs font-bold text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-1.5">
                                    <span class="material-symbols-outlined text-sm">psychology</span> Claude
                                </button>
                            </div>
                        </div>
                        <div class="space-y-2.5">
                            <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-widest">AI Brain Mode</label>
                            <div class="grid grid-cols-3 gap-2.5">
                                <button onclick="selectBrainMode('creative', this)" class="g1 rounded-xl p-3 text-xs font-bold text-slate-500 hover:text-slate-700 transition-all">Creative</button>
                                <button onclick="selectBrainMode('balanced', this)" class="rounded-xl p-3 text-xs font-bold text-purple-700 transition-all" style="background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2)">Balanced</button>
                                <button onclick="selectBrainMode('strict', this)" class="g1 rounded-xl p-3 text-xs font-bold text-slate-500 hover:text-slate-700 transition-all">Strict</button>
                            </div>
                        </div>
                        <button onclick="saveSettingsConfig()" class="text-white font-bold py-3 px-6 rounded-xl text-xs uppercase tracking-wider transition-all font-outfit hover:opacity-90" style="background:#0d9488">
                            Save Settings
                        </button>
                    </div>
                    <div class="g1 rounded-2xl p-6 flex flex-col justify-between shadow-sm" style="border-color:rgba(225,29,72,0.15)">
                        <div>
                            <h3 class="text-[10px] font-bold text-rose-500 uppercase tracking-widest pb-3 mb-3 border-b border-slate-100">Danger Zone</h3>
                            <p class="text-[11px] text-slate-500 leading-relaxed">Permanently clears all transaction records from the local database and returns your account to a clean baseline.</p>
                        </div>
                        <div class="space-y-2 mt-6">
                            <button onclick="handleClearLedger()" class="w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all font-outfit text-rose-600" style="background:rgba(225,29,72,0.06);border:1px solid rgba(225,29,72,0.18)">
                                Clear All Records
                            </button>
                            <span class="text-[9px] text-slate-400 text-center block">Stored in app/fintracker.db</span>
                        </div>
                    </div>
                </div>
            </div><!-- end settings -->
